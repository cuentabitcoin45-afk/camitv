<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Búsqueda - CamiTV</title>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/home/style.css">
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    .search-page { padding-top: 100px; min-height: 80vh; }
    .search-bar-container { max-width: 600px; margin: 0 auto 40px; position: relative; }
    .search-input {
      width: 100%; padding: 16px 20px 16px 50px; background: #171717;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
      color: #fff; font-size: 16px; transition: all 0.3s; outline: none;
    }
    .search-input:focus { border-color: #ef4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1); background: #1a1a1a; }
    .search-icon-inside { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #737373; pointer-events: none; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 24px; }
    .results-info { margin-bottom: 24px; color: #737373; font-size: 14px; }
    @media (min-width: 640px) { .results-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
  </style>
</head>
<body>
  <div id="nav"></div>
  
  <main class="container search-page">
    <div class="search-bar-container">
      <iconify-icon icon="lucide:search" class="search-icon-inside"></iconify-icon>
      <input type="text" id="globalSearchInput" class="search-input" placeholder="Busca por título, género o descripción..." autofocus>
    </div>
    
    <div id="resultsInfo" class="results-info">Introduce un término para buscar...</div>
    <div id="searchResultsGrid" class="results-grid"></div>
  </main>

  <div id="footer"></div>

  <!-- Componentes de UI compartidos -->
  <div class="modal-backdrop" id="movieModal" onclick="closeModalBackdrop(event)">
    <div class="modal-content" id="modalContent"></div>
  </div>
  <div class="toast" id="toast">
    <iconify-icon icon="lucide:check-circle" width="18" style="color:#22c55e"></iconify-icon>
    <span id="toastMsg"></span>
  </div>

  <script src="/data.js"></script>
  <script src="/common.js"></script>
  <script src="/header/header.js"></script>
  <script src="/footer/footer.js"></script>
  <script src="/search/search.js"></script>
</body>
</html>
