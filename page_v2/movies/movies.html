<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CamiTV - Catálogo Completo</title>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../home/style.css">
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    .movies-page-container { padding-top: 100px; min-height: 80vh; }
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 24px;
      margin-top: 32px;
    }
    @media (min-width: 640px) { .movies-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
  </style>
</head>
<body>

  <div id="nav"></div>

  <main class="container movies-page-container">
    <div class="genre-header">
      <h1 class="genre-title">Catálogo Completo</h1>
    </div>
    <div class="movies-grid" id="allMoviesGrid">
      <!-- Se llena dinámicamente -->
    </div>
  </main>

  <!-- Reutilizamos el modal y toast de la home para mantener consistencia -->
  <div class="modal-backdrop" id="movieModal" onclick="closeModalBackdrop(event)">
    <div class="modal-content" id="modalContent"></div>
  </div>
  <div class="toast" id="toast">
    <iconify-icon icon="lucide:check-circle" width="18" style="color:#22c55e"></iconify-icon>
    <span id="toastMsg"></span>
  </div>

  

  <script src="../data.js"></script>
  <script src="../common.js"></script>
  <script src="../header/header.js"></script>
  <script src="../footer/footer.js"></script>
  <script src="movies.js"></script>
</body>
</html>
