<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor - Netflix Clone</title>
    <link rel="stylesheet" href="player.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>
<body>
    <div class="video-wrapper" id="videoWrapper">
        <video id="mainVideo" class="main-video" autoplay>
            <source src="" type="video/mp4">
        </video>

        <!-- Indicador de Carga -->
        <div class="video-loader" id="videoLoader">
            <div class="spinner"></div>
            <span>Cargando...</span>
        </div>

        <!-- Capa de Controles -->
        <div class="video-controls" id="videoControls">
            <div class="controls-top">
                <button class="control-btn" onclick="history.back()">
                    <iconify-icon icon="lucide:arrow-left" width="32"></iconify-icon>
                </button>
                <div class="title-container">
                    <span class="watching-label">Estás viendo</span>
                    <h2 id="videoTitle" class="video-title">Título de la Película</h2>
                </div>
            </div>

            <!-- Botón Central de Play/Pause para Móviles -->
            <button class="center-play-btn" id="centerPlayBtn">
                <iconify-icon icon="lucide:play" width="64"></iconify-icon>
            </button>

            <div class="controls-bottom">
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                
                <div class="controls-row">
                    <div class="controls-left">
                        <button class="control-btn" id="playPauseBtn"><iconify-icon icon="lucide:play" width="24"></iconify-icon></button>
                        <button class="control-btn" id="rewindBtn"><iconify-icon icon="lucide:rotate-ccw" width="24"></iconify-icon></button>
                        <button class="control-btn" id="forwardBtn"><iconify-icon icon="lucide:rotate-cw" width="24"></iconify-icon></button>
                        <div class="volume-container">
                            <button class="control-btn" id="muteBtn"><iconify-icon icon="lucide:volume-2" width="24"></iconify-icon></button>
                            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1">
                        </div>
                        <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
                    </div>
                    <button class="control-btn" id="fullscreenBtn"><iconify-icon icon="lucide:maximize" width="24"></iconify-icon></button>
                </div>
            </div>
        </div>
    </div>
    <script src="../data.js"></script>
    <script src="player.js"></script>
</body>
</html>
