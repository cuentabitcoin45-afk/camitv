<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CamiTV - Mi Lista</title>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../home/style.css">
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    .my-list-container { padding-top: 100px; min-height: 80vh; }
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 24px;
      margin-top: 32px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #737373;
    }
    .movie-card { position: relative; }
    .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 20;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.1);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      opacity: 0;
      transition: all 0.3s ease;
    }
    .movie-card:hover .remove-btn { opacity: 1; }
    .remove-btn:hover { background: #ef4444; border-color: #ef4444; }

    @media (min-width: 640px) { .movies-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
  </style>
</head>
<body>

  <div id="nav"></div>

  <main class="container my-list-container">
    <div class="genre-header">
      <h1 class="genre-title">Mi Lista</h1>
    </div>
    <div class="movies-grid" id="myListGrid">
      <!-- Se llena dinámicamente -->
    </div>
  </main>

  <div class="modal-backdrop" id="movieModal" onclick="closeModalBackdrop(event)">
    <div class="modal-content" id="modalContent"></div>
  </div>
  <div class="toast" id="toast">
    <iconify-icon icon="lucide:check-circle" width="18" style="color:#22c55e"></iconify-icon>
    <span id="toastMsg"></span>
  </div>

 

  <script src="../data.js"></script>
  <script src="../common.js"></script>
  <script src="../header/header.js"></script>
  <script src="../footer/footer.js"></script>
  <script src="mi-lista.js"></script>
</body>
</html>
